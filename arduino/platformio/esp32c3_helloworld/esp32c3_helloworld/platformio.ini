; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 0
monitor_rts = 0

[seeed_xiao_esp32c3]
platform = espressif32@6.3.0
board = seeed_xiao_esp32c3
board_build.flash_mode = qio
upload_protocol = esptool
build_src_filter = 
	-<.git/>
	-<.svn/>
	+<*.h>
	+<${PIOENV}.cpp>

[lib_deps]
lib_deps = 
	electromagus/ESPMX1508@^1.0.5
	adafruit/Adafruit BusIO@^1.14.5
	bolderflight/Bolder Flight Systems SBUS@^8.1.4
	fastled/FastLED@^3.6.0
	makuna/NeoPixelBus@^2.7.7
	adafruit/Adafruit NeoPixel@^1.12.0
	adafruit/Adafruit TLC59711@^1.3.4
	plerup/EspSoftwareSerial@^8.2.0

[env:main_seeed_xiao_esp32c3]
extends = lib_deps, seeed_xiao_esp32c3

[env:main_seeed_xiao_esp32c3_v2_w_external_files]
extends = lib_deps, seeed_xiao_esp32c3
; extra_scripts = post:extra_script.py


